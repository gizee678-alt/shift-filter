name: Build Shift Filter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Create fresh Flutter project (correct Android embedding)
        run: |
          flutter create \
            --org com.shiftfilter \
            --project-name shift_filter \
            --platforms android \
            fresh_app

      - name: Inject our source code into fresh project
        run: |
          # Replace lib/ with our code
          rm -rf fresh_app/lib
          cp -r lib fresh_app/lib

          # Replace pubspec.yaml with our dependencies
          cp pubspec.yaml fresh_app/pubspec.yaml

          # Copy assets
          mkdir -p fresh_app/assets
          cp -r assets/. fresh_app/assets/ 2>/dev/null || true

      - name: Get dependencies
        working-directory: fresh_app
        run: flutter pub get

      - name: Generate launcher icons
        working-directory: fresh_app
        run: flutter pub run flutter_launcher_icons
        continue-on-error: true

      - name: Build release APK
        working-directory: fresh_app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShiftFilter-APK
          path: fresh_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
